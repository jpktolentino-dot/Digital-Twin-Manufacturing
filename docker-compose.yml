services:
  postgres:
    image: postgres:16-alpine
    container_name: jermam-postgres
    environment:
      POSTGRES_DB: jermam
      POSTGRES_USER: jermam
      POSTGRES_PASSWORD: jermam
    ports:
      - "5432:5432"
    volumes:
      - jermam_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jermam -d jermam"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/jermam
      DB_USERNAME: jermam
      DB_PASSWORD: jermam
      JWT_SECRET: local-compose-jermam-secret-please-change-2026
      CORS_ALLOWED_ORIGIN: http://localhost:3000
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  jermam_postgres_data:
