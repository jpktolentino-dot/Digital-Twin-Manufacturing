spring:
  datasource:
    url: jdbc:h2:mem:jermamtest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  sql:
    init:
      mode: never
app:
  jwt:
    secret: jermam-test-secret-key-please-change-1234567890
    expiration-minutes: 30
  cors:
    allowed-origin: http://localhost:3000
