spring:
  application:
    name: jermam-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jermam}
    username: ${DB_USERNAME:jermam}
    password: ${DB_PASSWORD:jermam}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: America/Sao_Paulo
server:
  port: ${SERVER_PORT:8080}
app:
  jwt:
    # Chave apenas para desenvolvimento acadêmico. Use variável de ambiente em produção.
    secret: ${JWT_SECRET:jermam-dev-secret-key-change-this-before-deploy-2026}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}
  simulacao:
    intervalo-segundos: 15
logging:
  level:
    com.jermam: INFO
    org.hibernate.SQL: WARN
